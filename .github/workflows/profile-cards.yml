name: Profile Cards

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: Dapravith
          cards: overview,contributions,lifetime,languages
          output-dir: assets/profile
          themes: light,dark
          commit: true
          commit-message: chore(profile): refresh generated cards [skip ci]
